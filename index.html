<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DAW-Dan v0.1</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>DAW-Dan v0.1</h1>
    <p>Live-Loops-style prototype (browser edition)</p>
  </header>

  <section class="transport">
    <button id="startAudioBtn">Start Audio</button>
    <button id="playBtn">Play</button>
    <button id="stopBtn">Stop</button>
    <label>
      BPM
      <input id="bpmInput" type="number" min="60" max="180" value="120" />
    </label>
    <label>
      Master
      <input id="masterVol" type="range" min="0" max="1" step="0.01" value="0.8" />
    </label>
    <span id="status">Status: idle</span>
  </section>

  <main>
    <section>
      <h2>Live Clip Grid</h2>
      <div id="grid" class="grid"></div>
      <button id="clearClipsBtn">Clear Active Clips</button>
    </section>

    <section>
      <h2>Scene Launch</h2>
      <div id="scenes" class="scenes"></div>
    </section>

    <section>
      <h2>Mixer</h2>
      <div id="mixer" class="mixer"></div>
    </section>

    <section>
      <h2>Step Sequencer</h2>
      <div id="sequencer" class="sequencer"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
